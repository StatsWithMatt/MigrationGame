<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conference Activity</title>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f5f5f5;
    }

    .image-container {
      position: relative;
      display: inline-block;
    }

    .image-container img {
      max-width: 80%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;   /* same size as image */
      height: 100%;
    }

    /* Position each text box using percentages */
    #line1 {
      position: absolute;
      bottom: 37%;   /* roughly upper part of bottom half */
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
    }

    #line2 {
      position: absolute;
      bottom: 21%;   /* middle of bottom half */
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
    }

    #line3 {
      position: absolute;
      bottom: 6%;   /* near bottom edge */
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
    }

    .overlay input {
      padding: 8px;
      font-size: 1em;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
  <h1>Welcome to the Activity!</h1>
  <p>You’ve been assigned this task:</p>

  <!-- Image + text boxes -->
  <div class="image-container">
    <img id="randomImage" alt="Random instruction image">
    <div class="overlay">
      <input type="text" id="line1" placeholder="Line 1..." />
      <input type="text" id="line2" placeholder="Line 2..." />
      <input type="text" id="line3" placeholder="Line 3..." />
    </div>
  </div>
</body>
</html>
