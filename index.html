<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conference Activity</title>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f5f5f5;
    }

    .image-container {
      position: relative;
      display: inline-block;
    }

    .image-container img {
      max-width: 80%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .overlay {
      position: absolute;
      top: 20%;              /* adjust vertical placement */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 60%;            /* width of the text boxes */
    }

    .overlay input {
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.8); /* semi-transparent background */
    }
  </style>
</head>
<body>
  <h1>Welcome to the Activity!</h1>
  <p>You’ve been assigned this task:</p>

  <!-- Image + text boxes -->
  <div class="image-container">
    <img id="randomImage" alt="Random instruction image">
    <div class="overlay">
      <input type="text" id="line1" placeholder="Type here for line 1..." />
      <input type="text" id="line2" placeholder="Type here for line 2..." />
      <input type="text" id="line3" placeholder="Type here for line 3..." />
    </div>
  </div>
</body>
</html>
